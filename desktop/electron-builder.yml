# electron-builder config. Keys verified against the installed electron-builder
# 25.1.8 schema (node_modules/app-builder-lib/out/options/*.d.ts) rather than
# assumed from memory - see plan doc's "Open Items" for what was checked.
appId: com.analog.pyadi-jif-explorer
productName: PyADI-JIF
# Without this, electron-builder auto-detects CI env vars and tries to
# publish a GitHub Release, failing outright without a GH_TOKEN even
# though nothing asked it to publish. We don't have a release/publish
# flow wired up yet - revisit when we do.
publish: null
directories:
  buildResources: build
files:
  - src/**/*
  - package.json
  # Ships the pinned pyadi-jif version/extras spec so the runtime's
  # self-heal-on-launch step (pythonRuntime.js's ensureAdijifInstalled)
  # can rebuild the same install the installer scripts attempted.
  - config/**/*
extraResources: []

win:
  target: nsis
  icon: build/icons/icon.ico
  extraResources:
    - from: resources/python/win32-x64
      to: python
    - from: resources/wheels/win32-x64
      to: wheels
    - from: build/license.txt
      to: THIRD-PARTY-LICENSES.txt
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer/win/customInstall.nsh
  # Generated by scripts/collect-licenses.mjs (part of prebuild:win) from
  # every vendored wheel's own license metadata/files - covers pyadi-jif
  # itself plus everything it pulls in (gekko, docplex, pyd2lang-native/d2,
  # streamlit, numpy, pandas, pyarrow, etc.), not just a hand-picked subset.
  # Bare filename directly in buildResourcesDir ("build/") - see the
  # comment in collect-licenses.mjs for why this exact path shape matters.
  license: license.txt

# macOS deliberately does NOT use electron-builder's built-in `pkg` target.
# That target only knows how to wrap the .app itself with pre/postinstall
# scripts - it has no mechanism to add a second component package installed
# outside the .app bundle, which is required here (see plan doc decision #4:
# pip-installed native extensions must never land inside the signed,
# hardened-runtime .app after it's sealed). So electron-builder only produces
# the signed, notarized .app (`target: dir`), and scripts/build-mac-pkg.mjs
# assembles the final two-component .pkg via raw pkgbuild/productbuild.
mac:
  # arm64 only - pyd2lang-native (the "draw" extra) ships no Intel-Mac
  # wheel and no sdist; see fetch-python.mjs.
  target:
    - target: dir
      arch: [arm64]
  icon: build/icons/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing identity is picked up from the CSC_NAME/CSC_LINK env vars at
  # build time (Developer ID Application cert) - not hardcoded here.

linux:
  target:
    - deb
    - rpm
  icon: build/icons/icon.png
  executableName: pyadi-jif
  extraResources:
    - from: resources/python/linux-x64
      to: python
    - from: resources/wheels/linux-x64
      to: wheels
    - from: build/license.txt
      to: THIRD-PARTY-LICENSES.txt
deb:
  afterInstall: build/installer/linux/postinst
  afterRemove: build/installer/linux/postremove
rpm:
  afterInstall: build/installer/linux/postinst
  afterRemove: build/installer/linux/postremove
